<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/p5.js"></script>

</head>

<body>
    <header>
        <h2>Dungeons and Dragons random character generator</h2>
    </header>
    <!-- Character sheet starts here -->
    <div>
        <!-- Character info -->
        <div>
            <!-- character name -->
            <article id="name">Name: </article>
            <!-- character race -->
            <article id="race">Race: </article>
            <!-- character class -->
            <article id="class">Class: </article>
        </div>
        <!-- stats -->
        <div>
            <!-- str -->
            <article>
                <!-- stat -->
                <div id="strength">STR: 0</div>
                <!-- modifier -->
                <div id="STRmod">0</div>
            </article>
            <!-- dex -->
            <article>
                <!-- stat -->
                <div id="dexterity">DEX: 0</div>
                <!-- modifier -->
                <div id="DEXmod">0</div>
            </article>
            <!-- con -->
            <article>
                <!-- stat -->
                <div id="constitution">CON: 0</div>
                <!-- modifier -->
                <div id="CONmod">0</div>
            </article>
            <!-- int -->
            <article>
                <!-- stat -->
                <div id="inteligence">INT: 0</div>
                <!-- modifier -->
                <div id="INTmod">0</div>
            </article>
            <!-- wis -->
            <article>
                <!-- stat -->
                <div id="wisdom">WIS: 0</div>
                <!-- modifier -->
                <div id="WISmod">0</div>
            </article>
            <!-- cha -->
            <article>
                <!-- stat -->
                <div id="charisma">CHA: 0</div>
                <!-- modifier -->
                <div id="CHAmod"> 0</div>
            </article>
        </div>
    </div>
    <button type="button" onclick="OnClickButton()">Roll Character</button>


    <footer>

    </footer>
    <script src="sketch.js"></script>
</body>

</html>
