<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/p5.js"></script>
</head>

<body>
    <header class="page-header">
        <h2>Dungeons and Dragons random character generator</h2>
    </header>

    <!-- Character sheet starts here -->
    <div class="character-sheet">

        <!-- Character info -->
        <div class="character-info">
            <article id="name" class="info-item">Name: </article>
            <article id="race" class="info-item">Race: </article>
            <article id="class" class="info-item">Class: </article>
        </div>

        <!-- Stats -->
        <div class="stats">
            <!-- Strength -->
            <article class="stat-box">
                <div id="strength" class="stat-value">STR: 0</div>
                <div id="STRmod" class="stat-mod">0</div>
            </article>
            <!-- dexterity -->
            <article class="stat-box">
                <div id="dexterity" class="stat-value">DEX: 0</div>
                <div id="DEXmod" class="stat-mod">0</div>
            </article>
            <!-- constitution -->
            <article class="stat-box">
                <div id="constitution" class="stat-value">CON: 0</div>
                <div id="CONmod" class="stat-mod">0</div>
            </article>
            <!-- inteligence -->
            <article class="stat-box">
                <div id="inteligence" class="stat-value">INT: 0</div>
                <div id="INTmod" class="stat-mod">0</div>
            </article>
            <!-- wisdom -->
            <article class="stat-box">
                <div id="wisdom" class="stat-value">WIS: 0</div>
                <div id="WISmod" class="stat-mod">0</div>
            </article>
            <!-- charisma -->
            <article class="stat-box">
                <div id="charisma" class="stat-value">CHA: 0</div>
                <div id="CHAmod" class="stat-mod">0</div>
            </article>

        </div>
    </div>

    <button type="button" class="roll-button" onclick="OnClickButton()">
        Roll Character
    </button>

    <footer class="page-footer">
        Made by Niek and Hugo
    </footer>

    <script src="sketch.js"></script>
</body>

</html>
